name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://docbot:docbot@localhost:5432/docbot
  LLM_PROVIDER: mock
  NEXT_TELEMETRY_DISABLED: 1
  ADMIN_EMAIL: admin@example.com

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: docbot
          POSTGRES_PASSWORD: docbot
          POSTGRES_DB: docbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docbot -d docbot"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate throwaway secrets (never stored in the repo)
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Check schema and migrations are in sync
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Seed (run twice to check idempotency)
        run: npx prisma db seed && npx prisma db seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests (PostgreSQL full-text search, persistence)
        run: npm run test:integration
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests (LLM_PROVIDER=mock)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway secrets (never stored in the repo)
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Start db + app with docker compose
        run: docker compose up -d --build
      - name: Wait for /api/health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 3
          done
          echo "App did not become healthy"; exit 1
      - name: Admin pages require a session
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" http://localhost:3000/admin)
          echo "GET /admin -> $code"
          [[ "$code" == 307*"/admin/login" ]]
          curl -fsS -o /dev/null http://localhost:3000/admin/login
      - name: Container logs
        if: always()
        run: docker compose logs app
      - name: Stop stack
        if: always()
        run: docker compose down -v
