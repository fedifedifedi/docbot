# Local stack: PostgreSQL + DocBot.
#   docker compose up -d db     -> database only (for `npm run dev`)
#   docker compose up --build   -> database + app on http://localhost:3000
# The credentials below are local-development defaults, not production secrets.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: docbot
      POSTGRES_PASSWORD: docbot
      POSTGRES_DB: docbot
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docbot -d docbot"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://docbot:docbot@db:5432/docbot
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
