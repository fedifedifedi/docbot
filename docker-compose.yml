# Local stack: PostgreSQL + DocBot.
#   docker compose up -d db     -> database only (for `npm run dev`)
#   docker compose up --build   -> database + app on http://localhost:3000
# The database credentials below are local-development defaults, not production secrets.
# Admin credentials and SESSION_SECRET are read from .env (see .env.example) — never hardcoded.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: docbot
      POSTGRES_PASSWORD: docbot
      POSTGRES_DB: docbot
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docbot -d docbot"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://docbot:docbot@db:5432/docbot
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (see .env.example)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env (see .env.example)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (see .env.example)}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
